name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run smoke tests
        run: dotnet run --project .\program\tests\SmokeTest\SmokeTest.csproj -c Release
      - name: Build self-contained package
        shell: pwsh
        run: .\scripts\Build-Release.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\artifacts\PersonalNavigator-win-x64.zip --verify-tag --generate-notes --title "Personal Navigator $env:GITHUB_REF_NAME"
