name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tags must be stable semantic versions, for example v1.1.0.'
          }
      - name: Build and test
        shell: pwsh
        run: |
          dotnet build .\program\PersonalNavigator.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet run --project .\program\tests\SmokeTest\SmokeTest.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Smoke tests failed.' }
      - name: Publish self-contained Windows application
        shell: pwsh
        run: .\scripts\Build-Release.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - name: Install NSIS build tool
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Create Windows setup wizard
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))
      - name: Verify version and write SHA256 checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $exe = '.\artifacts\win-x64\PersonalNavigator.exe'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe).Path)
          if ($info.FileVersion -ne "$version.0") { throw "App file version $($info.FileVersion) did not match $version.0" }
          $names = @('PersonalNavigator-Setup-win-x64.exe', 'PersonalNavigator-win-x64.zip')
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash ".\artifacts\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          Set-Content -Path .\artifacts\SHA256SUMS.txt -Value $lines -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME .\artifacts\PersonalNavigator-Setup-win-x64.exe .\artifacts\PersonalNavigator-win-x64.zip .\artifacts\SHA256SUMS.txt --verify-tag --generate-notes --title "Personal Navigator $env:GITHUB_REF_NAME"
