name: Semantic release

on:
  push:
    branches: [main]
    paths:
      - "program/**"
      - "scripts/Build-Release.ps1"
      - "scripts/Build-Installer.ps1"
      - "scripts/PersonalNavigator.nsi"
      - "scripts/Determine-Version.ps1"
      - "scripts/Generate-ReleaseNotes.ps1"
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      prerelease:
        description: Optional identifier such as beta.1
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump: ${{ steps.version.outputs.bump }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: version
        name: Calculate semantic version
        shell: pwsh
        run: ./scripts/Determine-Version.ps1 -RequestedBump '${{ inputs.bump || 'auto' }}' -Prerelease '${{ inputs.prerelease }}'

  major-approval:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.bump == 'major'
    runs-on: ubuntu-latest
    environment: major-release
    steps:
      - run: echo "Major release approved"

  build-release:
    needs: [prepare, major-approval]
    if: always() && needs.prepare.outputs.should_release == 'true' && (needs.major-approval.result == 'success' || needs.major-approval.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 8.0.x }
      - name: Validate application
        shell: pwsh
        run: |
          dotnet build .\program\PersonalNavigator.csproj -c Release -p:Version=${{ needs.prepare.outputs.version }}
          dotnet run --project .\program\tests\SmokeTest\SmokeTest.csproj -c Release
      - name: Build application and installer
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 -Version '${{ needs.prepare.outputs.version }}'
          choco install nsis -y --no-progress
          .\scripts\Build-Installer.ps1 -Version '${{ needs.prepare.outputs.version }}'
      - name: Validate installer metadata and uninstall
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          $installer = Resolve-Path ".\artifacts\PersonalNavigator-Setup-$version-win-x64.exe"
          $testDir = Join-Path $env:RUNNER_TEMP 'PersonalNavigator-Test'
          $install = Start-Process $installer -ArgumentList '/S',"/D=$testDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with $($install.ExitCode)" }
          $app = Join-Path $testDir 'PersonalNavigator.exe'
          if (-not (Test-Path $app)) { throw 'Installed executable missing.' }
          if (-not (Get-Item $app).VersionInfo.FileVersion.StartsWith($version)) { throw 'Installed version mismatch.' }
          $uninstall = Start-Process (Join-Path $testDir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path $app)) { throw 'Uninstall validation failed.' }
      - name: Generate notes and checksum
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          .\scripts\Generate-ReleaseNotes.ps1 -PreviousTag '${{ needs.prepare.outputs.previous_tag }}' -Version $version -OutputPath .\artifacts\release-notes.md
          $name = "PersonalNavigator-Setup-$version-win-x64.exe"
          $hash = (Get-FileHash ".\artifacts\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii
      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          $tag = "v$version"
          $args = @('release','create',$tag,".\artifacts\PersonalNavigator-Setup-$version-win-x64.exe",'.\artifacts\SHA256SUMS.txt','--target',$env:GITHUB_SHA,'--title',"Personal Navigator $version",'--notes-file','.\artifacts\release-notes.md')
          if ('${{ needs.prepare.outputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          gh @args
